name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Two runs for the same tag - a re-run alongside the original, or a tag pushed twice -
# would upload to the same release concurrently and race over its assets.
# `cancel-in-progress` stays false: killing a half-uploaded release is worse than
# waiting for it.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A ~20 second gate in front of a 4-way matrix that takes ~20 minutes a leg. Releasing
  # with no notes is not a cosmetic problem - the same text is what the in-app updater
  # shows - and a warning here would go green and be missed, which is exactly how v1.6.2
  # through v1.6.8 shipped with an empty changelog.
  changelog:
    name: Release notes exist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # No `npm ci`: the script reads two files and has no dependencies.
      - name: Check CHANGELOG.md has a section for this version
        env:
          REF_NAME: ${{ github.ref_name }}
        run: node scripts/check-changelog.mjs "$REF_NAME"

  release:
    needs: changelog
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm64
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04' # for Linux
            args: ''
          - platform: 'windows-latest' # for Windows
            args: ''

    runs-on: ${{ matrix.platform }}
    # A hung step otherwise runs to GitHub's 6 hour default before anyone notices. The
    # slowest healthy build so far is ~20 minutes, so this fails fast while leaving
    # generous headroom for a cold dependency cache.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the compare link in the release body is built from the
          # previous tag, and the default shallow clone has neither.
          fetch-depth: 0

      # Must run *before* setup-node: this deletes $AGENT_TOOLSDIRECTORY, which is the
      # tool cache setup-node installs Node into. Running it afterwards removes the very
      # toolchain the next steps depend on.
      - name: Free Disk Space (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          if [ -n "${AGENT_TOOLSDIRECTORY:-}" ]; then
            sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          fi

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's skip on linux and windows
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        # Bounded separately from the job: this step has hung indefinitely on the
        # ubuntu-22.04 image while the same commit installed fine on ubuntu-latest, so
        # it is worth failing in minutes rather than blocking the whole release.
        timeout-minutes: 15
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          set -eu
          # Wait for, rather than fail or block forever on, the dpkg/apt lock that
          # unattended-upgrades can hold on a fresh runner.
          APT_OPTS="-o DPkg::Lock::Timeout=120"

          for attempt in 1 2 3; do
            echo "::group::apt attempt $attempt"
            if sudo apt-get $APT_OPTS update && sudo apt-get $APT_OPTS install -y \
                 libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
                 librsvg2-dev libssl-dev pkg-config libasound2-dev; then
              echo "::endgroup::"
              exit 0
            fi
            echo "::endgroup::"
            echo "::warning::apt attempt $attempt failed; retrying"
            sleep 15
          done

          echo "::error::Could not install Linux build dependencies after 3 attempts."
          exit 1

      - name: install frontend dependencies
        run: npm ci

      # Signing is enabled by exporting secrets into $GITHUB_ENV only when they are
      # actually configured. Setting them directly on the build step would not work:
      # a secret that does not exist expands to an empty string, leaving the variable
      # *set but empty*, and the bundler then tries to sign with an empty key or
      # identity and fails the build. Exporting conditionally leaves it truly unset, so
      # builds keep succeeding unsigned until the secrets are added.
      - name: Configure signing
        shell: bash
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MAC_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          MAC_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          MAC_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eu

          # Append to $GITHUB_ENV using heredoc syntax. A plain `echo "NAME=$value"`
          # silently corrupts any value containing a newline, which private keys and
          # base64 certificate blobs often do.
          put_env() {
            delim="EOF_$(date +%s%N)_$$"
            {
              printf '%s<<%s\n' "$1" "$delim"
              printf '%s\n' "$2"
              printf '%s\n' "$delim"
            } >> "$GITHUB_ENV"
          }

          # Tauri's own update signature. Unrelated to Apple code signing: this is what
          # lets an already-installed app verify an update really came from us. The
          # public half lives in tauri.conf.json under plugins.updater.pubkey.
          # Generate a keypair with: npm run tauri signer generate
          if [ -n "$UPDATER_KEY" ]; then
            put_env TAURI_SIGNING_PRIVATE_KEY "$UPDATER_KEY"
            put_env TAURI_SIGNING_PRIVATE_KEY_PASSWORD "$UPDATER_KEY_PASSWORD"
            echo "Updater signing enabled."
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set - the updater manifest will be unsigned and installed apps cannot auto-update."
          fi

          # Apple code signing + notarization. Requires a paid Apple Developer Program
          # membership for a "Developer ID Application" certificate. Without it macOS
          # reports "App is damaged and cannot be opened" on download, because a
          # quarantined app with no valid signature is refused outright on Apple Silicon.
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "$MAC_SIGNING_IDENTITY" ]; then
              put_env APPLE_CERTIFICATE "$MAC_CERTIFICATE"
              put_env APPLE_CERTIFICATE_PASSWORD "$MAC_CERTIFICATE_PASSWORD"
              put_env APPLE_SIGNING_IDENTITY "$MAC_SIGNING_IDENTITY"
              put_env APPLE_ID "$MAC_APPLE_ID"
              put_env APPLE_PASSWORD "$MAC_APPLE_PASSWORD"
              put_env APPLE_TEAM_ID "$MAC_TEAM_ID"
              echo "macOS code signing enabled."
            else
              echo "::warning::Apple signing secrets are not configured - the macOS build will be unsigned and users will see 'App is damaged and cannot be opened'."
            fi
          fi

      # Builds the release body: what actually changed, plus the macOS quarantine
      # workaround when the build is unsigned. Runs on every platform because whichever
      # job creates the release first supplies the body.
      #
      # The composition lives in scripts/release-notes.sh rather than here: the same code
      # has to regenerate an old release locally, and markdown written inside a YAML block
      # scalar cannot start a line at column 0 without terminating the scalar.
      - name: Compose release notes
        shell: bash
        env:
          MAC_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -eu

          # package.json, not the tag: tauri-action takes __VERSION__ in releaseName from
          # it, as do every asset filename and latest.json, so notes keyed off a tag that
          # disagreed would describe a different build than the one attached. The
          # `changelog` gate job has already checked the two agree.
          VERSION="$(node -p "require('./package.json').version")"

          # `if ! VAR="$(...)"` rather than a bare assignment: the `if` condition suspends
          # errexit, so the failure is reported here instead of exiting with no message.
          if ! RELEASE_NOTES="$(bash scripts/release-notes.sh "v${VERSION}")"; then
            echo "::error file=CHANGELOG.md::No '## [${VERSION}]' section in CHANGELOG.md - refusing to publish a release with empty notes."
            exit 1
          fi

          # Append to $GITHUB_ENV using heredoc syntax. A plain `echo "NAME=$value"`
          # silently corrupts any value containing a newline, and a release body is almost
          # entirely newlines.
          delim="EOF_$(date +%s%N)_$$"
          {
            printf '%s<<%s\n' RELEASE_BODY "$delim"
            printf '%s\n' "$RELEASE_NOTES"
            printf '%s\n' "$delim"
          } >> "$GITHUB_ENV"

          # ::stop-commands:: so a changelog line that happens to begin with `::` is
          # echoed rather than executed as a workflow command.
          echo "--- release notes ---"
          echo "::stop-commands::$delim"
          printf '%s\n' "$RELEASE_NOTES"
          echo "::$delim::"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }} # This determines the release; On manual run, it will use the branch name.
          releaseName: 'Stashpad v__VERSION__'
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
