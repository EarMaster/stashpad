name: Release
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest' # for Arm64
            args: '--target aarch64-apple-darwin'
          - platform: 'macos-latest' # for Intel
            args: '--target x86_64-apple-darwin'
          - platform: 'ubuntu-22.04' # for Linux
            args: ''
          - platform: 'windows-latest' # for Windows
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history and tags: the release notes are built from the commits since
          # the previous tag, and the default shallow clone has neither.
          fetch-depth: 0

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Free Disk Space (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          # Those targets are only used on macos runners so it's skip on linux and windows
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: install dependencies (ubuntu only)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config libasound2-dev

      - name: install frontend dependencies
        run: npm ci

      # Signing is enabled by exporting secrets into $GITHUB_ENV only when they are
      # actually configured. Setting them directly on the build step would not work:
      # a secret that does not exist expands to an empty string, leaving the variable
      # *set but empty*, and the bundler then tries to sign with an empty key or
      # identity and fails the build. Exporting conditionally leaves it truly unset, so
      # builds keep succeeding unsigned until the secrets are added.
      - name: Configure signing
        shell: bash
        env:
          UPDATER_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          UPDATER_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MAC_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          MAC_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          MAC_APPLE_ID: ${{ secrets.APPLE_ID }}
          MAC_APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          MAC_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -eu

          # Append to $GITHUB_ENV using heredoc syntax. A plain `echo "NAME=$value"`
          # silently corrupts any value containing a newline, which private keys and
          # base64 certificate blobs often do.
          put_env() {
            delim="EOF_$(date +%s%N)_$$"
            {
              printf '%s<<%s\n' "$1" "$delim"
              printf '%s\n' "$2"
              printf '%s\n' "$delim"
            } >> "$GITHUB_ENV"
          }

          # Tauri's own update signature. Unrelated to Apple code signing: this is what
          # lets an already-installed app verify an update really came from us. The
          # public half lives in tauri.conf.json under plugins.updater.pubkey.
          # Generate a keypair with: npm run tauri signer generate
          if [ -n "$UPDATER_KEY" ]; then
            put_env TAURI_SIGNING_PRIVATE_KEY "$UPDATER_KEY"
            put_env TAURI_SIGNING_PRIVATE_KEY_PASSWORD "$UPDATER_KEY_PASSWORD"
            echo "Updater signing enabled."
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set - the updater manifest will be unsigned and installed apps cannot auto-update."
          fi

          # Apple code signing + notarization. Requires a paid Apple Developer Program
          # membership for a "Developer ID Application" certificate. Without it macOS
          # reports "App is damaged and cannot be opened" on download, because a
          # quarantined app with no valid signature is refused outright on Apple Silicon.
          if [ "$RUNNER_OS" = "macOS" ]; then
            if [ -n "$MAC_SIGNING_IDENTITY" ]; then
              put_env APPLE_CERTIFICATE "$MAC_CERTIFICATE"
              put_env APPLE_CERTIFICATE_PASSWORD "$MAC_CERTIFICATE_PASSWORD"
              put_env APPLE_SIGNING_IDENTITY "$MAC_SIGNING_IDENTITY"
              put_env APPLE_ID "$MAC_APPLE_ID"
              put_env APPLE_PASSWORD "$MAC_APPLE_PASSWORD"
              put_env APPLE_TEAM_ID "$MAC_TEAM_ID"
              echo "macOS code signing enabled."
            else
              echo "::warning::Apple signing secrets are not configured - the macOS build will be unsigned and users will see 'App is damaged and cannot be opened'."
            fi
          fi

      # Builds the release body: what actually changed, plus the macOS quarantine
      # workaround when the build is unsigned. Runs on every platform because whichever
      # job creates the release first supplies the body.
      - name: Compose release notes
        shell: bash
        env:
          MAC_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu

          # Newlines are appended via $NL rather than written literally: a line at
          # column 0 would terminate this YAML block scalar, and indenting the markdown
          # would render it as code blocks in the release notes.
          NL=$'\n'

          # The tag before this one. Missing on the very first release, in which case
          # the whole history is summarised.
          PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${TAG}"
            echo "Changelog range: $RANGE"
          else
            RANGE=""
            echo "No previous tag found; summarising full history."
          fi

          # Subjects for one conventional-commit type, with the prefix stripped.
          # `chore: bump version` is dropped - it is bookkeeping, not a change.
          subjects_for() {
            git log --no-merges --pretty=format:'%s' $RANGE \
              | grep -E "^$1(\([^)]*\))?!?: " \
              | grep -vE '^chore(\([^)]*\))?!?: bump version' \
              | sed -E 's/^[a-z]+(\([^)]*\))?!?: //' \
              || true
          }

          section() {
            title="$1"; body="$2"
            [ -z "$body" ] && return 0
            CHANGES="$CHANGES$NL$NL### $title$NL"
            CHANGES="$CHANGES$(printf '%s' "$body" | sed 's/^/- /')"
          }

          CHANGES=""
          section 'Features' "$(subjects_for 'feat')"
          section 'Fixes' "$(subjects_for 'fix')"
          section 'Other' "$(subjects_for '(perf|refactor|build|docs|style|test|chore)')"

          RELEASE_NOTES='See the assets below to download the latest version of Stashpad.'

          # $CHANGES already starts with its own blank line.
          if [ -n "$CHANGES" ]; then
            RELEASE_NOTES="$RELEASE_NOTES${CHANGES}"
          fi

          if [ -n "$PREV_TAG" ]; then
            RELEASE_NOTES="$RELEASE_NOTES$NL$NL"'**Full changelog:** '"https://github.com/${GITHUB_REPOSITORY}/compare/${PREV_TAG}...${TAG}"
          fi

          RELEASE_NOTES="$RELEASE_NOTES$NL$NL"'---'
          RELEASE_NOTES="$RELEASE_NOTES$NL$NL"'**macOS:** choose `aarch64` for Apple Silicon (M1-M4) or `x64` for Intel.'

          # Without notarization every macOS user sees "damaged and cannot be opened" and
          # most will assume the download is broken, so the fix belongs in the release
          # itself rather than only in the README.
          if [ -z "$MAC_SIGNING_IDENTITY" ]; then
            RELEASE_NOTES="$RELEASE_NOTES$NL$NL"'### ⚠️ macOS: "Stashpad is damaged and cannot be opened"'
            RELEASE_NOTES="$RELEASE_NOTES$NL$NL"'The macOS builds are not notarized by Apple. macOS refuses to launch a downloaded app whose signature it cannot verify, and reports it as damaged - **the download is fine**.'
            RELEASE_NOTES="$RELEASE_NOTES$NL$NL"'After dragging Stashpad to Applications, clear the quarantine flag:'
            RELEASE_NOTES="$RELEASE_NOTES$NL$NL"'```bash'
            RELEASE_NOTES="$RELEASE_NOTES$NL"'xattr -dr com.apple.quarantine /Applications/stashpad.app'
            RELEASE_NOTES="$RELEASE_NOTES$NL"'```'
            RELEASE_NOTES="$RELEASE_NOTES$NL$NL"'Right-click → Open does not help with this particular error; on Apple Silicon an unsigned binary is refused outright.'
          fi

          delim="EOF_$(date +%s%N)_$$"
          {
            printf '%s<<%s\n' RELEASE_BODY "$delim"
            printf '%s\n' "$RELEASE_NOTES"
            printf '%s\n' "$delim"
          } >> "$GITHUB_ENV"

          echo "--- release notes ---"
          printf '%s\n' "$RELEASE_NOTES"

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }} # This determines the release; On manual run, it will use the branch name.
          releaseName: 'Stashpad v__VERSION__'
          releaseBody: ${{ env.RELEASE_BODY }}
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
