name: Tests

# Also called by release.yml as a reusable workflow, which is what makes this suite the gate
# in front of a release rather than a report that happens alongside one. There is exactly one
# copy of these jobs; a release run shows them in its own graph.
on:
  # `push: main` is deliberately absent: a merge to main reaches this suite through
  # release.yml's `workflow_call`, and having both triggers would run the whole 3-OS matrix
  # twice per merge. Pushes to develop are direct and would otherwise reach a PR untested.
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_call:
  workflow_dispatch:

# A PR from develop satisfies both triggers above, so one commit gets two runs of the same
# eight checks. That is kept on purpose: the push run is the pre-PR signal, and the
# pull_request run is the only one that tests the merge result and the only one that runs at
# all for a fork - this repo is public, and a fork's PR would otherwise arrive with none of
# the contexts the ruleset requires.
#
# What is not wanted is a run that has been superseded. Pushing again while checks are in
# flight used to leave the old run finishing a full three-OS matrix for a commit that is no
# longer the PR head.
#
# The group carries the event as well as the commit so the push and pull_request runs of the
# same commit stay in separate groups and never cancel each other - a required context that
# lands as `cancelled` would block the merge. Including the sha also keeps release.yml's
# `workflow_call` safe: it runs against a main commit nothing else here builds, so a release
# cannot be cancelled by ordinary branch activity.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  # Green between releases, since package.json and the newest CHANGELOG.md heading agree.
  # It goes red in the window between a version bump and a written changelog - which is
  # the window in which a release with empty notes gets tagged.
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    # Bounded because these are required contexts: a job that hangs, or sits in a runner
    # queue, blocks a merge with no signal at all. One Tests run waited thirteen minutes for
    # a windows-latest runner and nothing anywhere would have stopped it short of GitHub's
    # six-hour default.
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # No `npm ci`: the script reads two files and has no dependencies.
      - name: Check CHANGELOG.md has a section for the current version
        run: node scripts/check-changelog.mjs

  frontend-tests:
    name: Frontend Tests
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Not a test, but cheap and with nothing else to gate it: a stray `Date` passes every
      # test that does not happen to compare two timestamps as strings.
      - name: Check Temporal is the only date API
        run: npm run check:temporal

      # Split by OS rather than run both: `test:coverage` is `vitest run --coverage`, the
      # same fourteen files end to end, so ubuntu was running the whole suite twice.
      - name: Run tests
        if: matrix.os != 'ubuntu-latest'
        run: npm run test

      - name: Run tests with coverage
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v7
        with:
          # `files`, plural: v5 deprecated the singular `file`, and a v7 that does not
          # recognise the input uploads nothing while still reporting success.
          files: ./coverage/coverage-final.json
          flags: frontend
          fail_ci_if_error: false

  backend-tests:
    name: Backend Tests (Rust)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # Backgrounded, because as a blocking step this cost 91 seconds in a job whose actual
      # work - `cargo test` - takes 24. Almost all of it is /usr/local/lib/android, nine
      # gigabytes of small files. What matters is that the disk is free before the build
      # needs it, not before the next step starts, so apt and cargo now run alongside it.
      #
      # $AGENT_TOOLSDIRECTORY is deliberately no longer deleted. Removing it is what forced
      # this step to run before any setup-node, and a backgrounded rm would race whatever
      # installs there. What is left still frees ~15 GB, against a debug target directory
      # that is under a gigabyte since `[profile.dev.package."*"] debug = false` landed in
      # Cargo.toml - the 37 GB build this step was written for cannot happen any more.
      - name: Reclaim disk in the background
        if: matrix.os == 'ubuntu-latest'
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet >/dev/null 2>&1 &
          sudo rm -rf /opt/ghc /usr/local/share/boost >/dev/null 2>&1 &

      - name: Install dependencies (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config libasound2-dev

      # dtolnay/rust-toolchain, matching release.yml. actions-rs/toolchain was archived in 2023
      # and pins a deprecated Node runtime - tolerable in an advisory job, a latent hard failure
      # now that this suite gates every release.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # `save-if` is what keeps this affordable. Every push and every pull_request run used to
      # write a fresh entry per OS - ~800 MiB each - and twelve of them had grown to fill
      # 8.6 GB of GitHub's 10 GB per-repository budget, at which point the cache evicts itself
      # and nothing stays warm. Four of the twelve were scoped to a pull request that had long
      # since merged, and could never be read again by anything.
      #
      # `main`, not `develop`, and that is the whole point of the line. A run may restore only
      # caches scoped to its own ref or to the default branch, and the default branch here is
      # `main` - so a cache written from `develop` is invisible to a release, and one written
      # from a PR is invisible to everything. Saving from `main` is the only scope every run
      # can read: develop pushes, PRs and releases alike restore from it.
      #
      # This suite does reach `main`: release.yml calls it through `workflow_call`, where
      # `github.ref` is the caller's ref. So the cache refreshes once per release, which is
      # roughly daily. A `Cargo.lock` or rustc change between releases means develop runs cold
      # until the next one - the honest cost of three entries instead of nine.
      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --verbose

      # Both lints gate. They were advisory while the tree was not clean - and an advisory step
      # that fails on every run is noise nobody reads, so findings piled up: by v1.9.0 clippy had
      # 14 in the lib and 6 in its tests, and fmt 324 diffs, each run showing two red "exit code"
      # annotations on a green pipeline. The tree is clean now, so a new finding fails the job.
      #
      # `--all-targets` so test code is held to the same bar: without it clippy checks only the
      # lib and bins, and the test findings above were never reported at all.
      #
      # One OS, not three. Both lints are mostly platform-independent, and clippy's check-mode
      # artifacts carry different fingerprints from the test build's - so on every leg it was a
      # second near-full compile. The price: code behind `#[cfg(target_os = "windows")]` or
      # `"macos"` is not linted here. Run `cargo clippy --all-targets` locally on those.
      - name: Run Clippy
        if: matrix.os == 'ubuntu-latest'
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        working-directory: src-tauri
        run: cargo fmt --check

  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # 22, matching every other job and the toolchain the release actually builds on. This was
      # 20, which is a poor thing for a release gate to be compiling against.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npx tsc --noEmit
