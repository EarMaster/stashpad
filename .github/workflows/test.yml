name: Tests

# Also called by release.yml as a reusable workflow, which is what makes this suite the gate
# in front of a release rather than a report that happens alongside one. There is exactly one
# copy of these jobs; a release run shows them in its own graph.
on:
  # `push: main` is deliberately absent: a merge to main reaches this suite through
  # release.yml's `workflow_call`, and having both triggers would run the whole 3-OS matrix
  # twice per merge. Pushes to develop are direct and would otherwise reach a PR untested.
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_call:
  workflow_dispatch:

jobs:
  # Green between releases, since package.json and the newest CHANGELOG.md heading agree.
  # It goes red in the window between a version bump and a written changelog - which is
  # the window in which a release with empty notes gets tagged.
  changelog:
    name: Changelog
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # No `npm ci`: the script reads two files and has no dependencies.
      - name: Check CHANGELOG.md has a section for the current version
        run: node scripts/check-changelog.mjs

  frontend-tests:
    name: Frontend Tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test

      - name: Generate coverage report
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:coverage

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest'
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/coverage-final.json
          flags: frontend
          fail_ci_if_error: false

  backend-tests:
    name: Backend Tests (Rust)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Free Disk Space (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          if [ -n "${AGENT_TOOLSDIRECTORY:-}" ]; then
            sudo rm -rf "$AGENT_TOOLSDIRECTORY"
          fi

      - name: Install dependencies (Ubuntu only)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libssl-dev pkg-config libasound2-dev

      # dtolnay/rust-toolchain, matching release.yml. actions-rs/toolchain was archived in 2023
      # and pins a deprecated Node runtime - tolerable in an advisory job, a latent hard failure
      # now that this suite gates every release.
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Run Rust tests
        working-directory: src-tauri
        run: cargo test --verbose

      # Both lint steps below are ADVISORY and named so, because this suite now decides whether
      # a merge to main ships a binary and "Tests passed" must not be read as "lint passed".
      #
      # Neither is currently clean: `cargo clippy -- -D warnings` reports 11 findings in the lib
      # and 14 in lib tests across 10 lint families (len_zero, single_match, manual_flatten,
      # ptr_arg, result_large_err and friends - all cosmetic, no correctness issues), and
      # `cargo fmt --check` reports 231 diffs, meaning the tree has never been rustfmt'd.
      #
      # Gating them is the right end state and it is cheap - one `cargo fmt` commit plus a pass
      # over ten lint families - but it is a tree-wide reformat that would bury `git blame`, so
      # it belongs in its own commit rather than riding along with a CI change. When that lands,
      # drop the `continue-on-error` and the "(advisory)" from both names.
      - name: Run Clippy (advisory, non-gating)
        working-directory: src-tauri
        run: cargo clippy -- -D warnings
        continue-on-error: true

      - name: Check formatting (advisory, non-gating)
        working-directory: src-tauri
        run: cargo fmt --check
        continue-on-error: true

  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 22, matching every other job and the toolchain the release actually builds on. This was
      # 20, which is a poor thing for a release gate to be compiling against.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript compiler
        run: npx tsc --noEmit
