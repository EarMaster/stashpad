# Version updates. Alerts are a repository setting and need nothing here; this file is only
# the scheduled "bump things that are behind" pull requests.
#
# Only the workflows are covered. npm and cargo were here once and were taken out on purpose,
# so do not add them back without reading why:
#
# - Version updates only move what package.json and Cargo.toml name directly. Every alert
#   the repository actually had was in a transitive crate (openssl, rustls-webpki, tar...),
#   which these pull requests never touch - the grouped cargo one fixed none of the 20 open
#   alerts it sat next to.
# - Each major arrives as its own pull request that fails CI until someone does the
#   migration, and each cargo one rewrites Cargo.lock, which busts the Rust cache and
#   compiles all 799 crates cold on three operating systems.
# - Security updates would target the alerts, but they always aim at the default branch,
#   `main`, where a merge is the release decision. `target-branch` does not apply to them,
#   so they stay switched off in the repository settings.
#
# Instead, dependencies are refreshed by hand on `develop` before a release (`cargo update`,
# `npm update`, then check the open alerts). Alerts read the lockfiles on `main`, so they
# close when that release is promoted.
version: 2

updates:
  # The workflows themselves. This is cheap and useful: it is what would have flagged
  # actions-rs/toolchain being archived in 2023, which test.yml had to notice by hand.
  - package-ecosystem: "github-actions"
    directory: "/"
    # Dependabot aims at the default branch unless told otherwise, and the default branch
    # here is `main` - where a merge *is* the release decision. A dependency pull request
    # merged there would start release.yml. It would not actually release (the tag for the
    # current version already exists, so `prepare` decides should_release=false and stops),
    # but it would run the whole suite to reach that conclusion, and it is the wrong branch
    # for how this repository works. Everything lands on `develop` and is promoted.
    target-branch: "develop"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3
    groups:
      # One pull request for everything routine. Majors stay individual - those are the
      # ones that need reading.
      actions-minor-and-patch:
        update-types: ["minor", "patch"]
