[package]
name = "stashpad"
version = "1.8.7"
description = "The staging area for your AI context."
authors = ["Nico Wiedemann <nico.wiedemann@gmail.com>"]
repository = "https://github.com/EarMaster/stashpad"
license = "AGPL-3.0-only"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.9.4", features = ["protocol-asset"] }
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
active-win-pos-rs = "0.8"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
dirs = "6.0.0"
arboard = "3.6.1"
drag = { git = "https://github.com/crabnebula-dev/drag-rs" }
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-devtools = "2.0.0"
tauri-plugin-dialog = "2"
window-vibrancy = "0.5"
tauri-plugin-window-state = "2.4.1"
tauri-plugin-fs = "2.4.4"
tauri-plugin-shell = "2.3.3"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1.11", features = ["v4", "serde"] }
mime_guess = "2.0.5"
tauri-plugin-autostart = "2.5.1"
aes-gcm = "0.10"
sha2 = "0.10"
rand = "0.8"
# Only for the device passphrase - the one human-chosen input in the app, and the only
# place a work factor buys anything. Everything else derives from full-entropy material.
argon2 = "0.5"
# Record encryption. XChaCha20-Poly1305 rather than AES-GCM because two installations
# encrypt independently while offline and cannot coordinate a counter: a 192-bit nonce
# makes random nonces safe with no state to share.
chacha20poly1305 = "0.10"
hkdf = "0.12"
# Device key agreement. Paired with hkdf and chacha20poly1305 above, this is the sealed-box
# construction (ephemeral key, ECDH, derive, seal) rather than a full HPKE dependency -
# see the note in src/e2ee.rs for exactly what is bound into the derivation and why.
x25519-dalek = { version = "2", features = ["static_secrets", "zeroize"] }
zeroize = { version = "1", features = ["zeroize_derive"] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
reqwest = { version = "0.12", features = ["json"] }
regex = "1.12.3"
tokio-tungstenite = { version = "0.26.1", features = ["native-tls"] }
futures-util = "0.3"
urlencoding = "2.1.3"
tokio = { version = "1.50.0", features = ["time"] }
# Deflate only: the other backends (zstd, lzma, bzip2) pull in native toolchains we do
# not need, and every archive we read or write uses deflate.
zip = { version = "2", default-features = false, features = ["deflate"] }
serde_yaml = "0.9"

# Apple Intelligence (Foundation Models) - macOS 26+ only
# keyring ships NO default features and, without one, silently compiles its in-memory
# `mock` store - which is what this crate did until now, so the OS credential store has
# never actually worked on any platform. The backend is declared per target so a dbus
# dependency is never dragged into the Windows or macOS builds.
#
# Deliberately not `linux-native`/`linux-native-sync-persistent`: kernel keyutils entries
# do not reliably survive a reboot, so they would appear to work and then lose the key.
# `crypto-rust` supplies the Secret Service session encryption in Rust, so no OpenSSL.
[target.'cfg(target_os = "macos")'.dependencies]
fm-rs = { version = "0.1", optional = true }
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }

[features]
macos-apple-intelligence = ["fm-rs"]

[dev-dependencies]
tempfile = "3"

# Dependencies are compiled without debug info; this crate keeps its own.
#
# A debug build of this tree reached 37 GB, and 4.8 GB of that was `.pdb` files for
# crates nobody steps into - the whole Tauri, reqwest and sqlx stack carrying full
# symbols so a backtrace could name a frame inside them. Backtraces still name every
# frame in `stashpad` itself, which is the part worth debugging.
[profile.dev.package."*"]
debug = false
